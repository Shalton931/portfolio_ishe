<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ishe Shalton Milubi | Portfolio</title>
  <meta name="description" content="Portfolio of Ishe Shalton Milubi, final-year BSc IT student and software developer in Johannesburg.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="#top" id="brand">Ishe S. Milubi</a>
      <nav aria-label="Primary">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#education">Education</a>
        <a href="#achievements">Achievements</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap" id="top" aria-labelledby="name">
      <p class="eyebrow" id="location">&nbsp;</p>
      <h1 id="name">Loading&hellip;</h1>
      <p class="lead" id="headline"></p>
      <p class="cta"><a class="btn" id="contact" href="#about" hidden>Get in touch</a></p>
    </section>

    <section class="wrap" id="about" aria-labelledby="about-h">
      <h2 id="about-h">About</h2>
      <p id="summary" class="prose"></p>
    </section>

    <section class="wrap" id="projects" aria-labelledby="projects-h">
      <h2 id="projects-h">Projects</h2>
      <div class="grid" id="project-list" aria-live="polite"></div>
    </section>

    <section class="wrap" id="skills" aria-labelledby="skills-h">
      <h2 id="skills-h">Skills</h2>
      <div class="grid skills" id="skill-list"></div>
    </section>

    <section class="wrap" id="education" aria-labelledby="education-h">
      <h2 id="education-h">Education</h2>
      <ol class="timeline" id="education-list"></ol>
    </section>

    <section class="wrap" id="achievements" aria-labelledby="achievements-h">
      <h2 id="achievements-h">Achievements and development</h2>
      <ul class="plain" id="achievement-list"></ul>
    </section>

    <p class="wrap status" id="status" role="status" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="year"></span> Ishe Shalton Milubi. No cookies, no tracking.</p>
      <p><a href="privacy.html">Privacy notice (POPIA)</a></p>
    </div>
  </footer>
</body>
</html>
